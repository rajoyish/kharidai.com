name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      # 1. SETUP PHP AND COMPOSER FIRST
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, json, libxml
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      # 2. SETUP NODE AND BUILD ASSETS SECOND
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      # `build:ssr` produces the client bundle *and* bootstrap/ssr/ssr.js, which
      # is the file the SSR process runs. A plain `npm run build` would ship the
      # app without an SSR bundle, and Inertia would silently fall back to
      # client-side rendering.
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build:ssr

      - name: Verify SSR Bundle Was Built
        run: test -f bootstrap/ssr/ssr.js || (echo "SSR bundle missing — the SSR server has nothing to run." && exit 1)

      # 3. DEPLOYMENT STEPS REMAIN THE SAME
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # vendor/ is installed here on the runner, and Composer bakes the PHP
      # version and extensions it resolved against into platform_check.php,
      # which every request and artisan call runs first. Run that same check
      # with the server's PHP before touching anything: if it fails after the
      # rsync, `php artisan up` fails with everything else and the site stays
      # stuck in maintenance mode.
      #
      # cPanel's MultiPHP Manager pins a site's PHP version by writing a handler
      # block into the docroot's .htaccess. rsync --delete would replace that
      # file with the repo's copy and quietly drop the site back to the server
      # default PHP, so refuse to deploy until the block is committed.
      - name: Preflight Server PHP
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          DEST="${{ secrets.SERVER_DESTINATION_PATH }}"

          if ! ssh "${SERVER}" "cd ${DEST} && php" < vendor/composer/platform_check.php; then
            echo "::error::The server's PHP does not meet composer.json's platform requirements. Upgrade it in cPanel → MultiPHP Manager, then re-run this deploy."
            exit 1
          fi

          HANDLER_MARKER='php -- BEGIN cPanel-generated handler'
          if ssh "${SERVER}" "grep -qF -- '${HANDLER_MARKER}' ${DEST}/public/.htaccess" \
            && ! grep -qF -- "${HANDLER_MARKER}" public/.htaccess; then
            echo "::error::The server's public/.htaccess carries a cPanel PHP handler block that this deploy would delete. Copy it into the repo's public/.htaccess and commit it."
            exit 1
          fi

      - name: Enable Maintenance Mode
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            php artisan down --refresh=15 || true

      # NOTE: bootstrap/ssr is deliberately NOT excluded — it holds the SSR
      # bundle the Node process runs. It is gitignored, but rsync copies the CI
      # workspace rather than the git index, so the freshly built bundle ships.
      - name: Deploy with Rsync
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DESTINATION_PATH }}
            
      - name: Run Post-Deployment Artisan Commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            if [ ! -L public/storage ]; then
              rm -rf public/storage
              php artisan storage:link
            fi

            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart || true

            # The SSR server is a long-lived Node process holding the previous
            # bundle in memory, so it has to be recycled or the site keeps
            # serving stale renders. rsync runs with --no-perms, which drops the
            # exec bit, hence the explicit chmod and the `bash` invocation.
            chmod +x scripts/ssr-server.sh
            bash scripts/ssr-server.sh restart

            php artisan up

      - name: Disable Maintenance Mode
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            php artisan up || true

      # A broken SSR render still answers 200 with an empty root, so the status
      # code alone proves nothing; the data-server-rendered marker does. The
      # query string keeps an edge cache from answering with a stale page.
      - name: Smoke Test Production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            APP_URL="$(php artisan tinker --execute 'echo rtrim(config("app.url"), "/");')"

            if ! curl -fsS -m 20 -o /dev/null "${APP_URL}/up"; then
              echo "Health check failed: ${APP_URL}/up — see storage/logs/laravel.log"
              exit 1
            fi

            if ! curl -fsS -m 20 "${APP_URL}/?deploy-check=$(date +%s)" | grep -q 'data-server-rendered'; then
              echo "${APP_URL}/ is not server-rendered — see storage/logs/ssr.log"
              exit 1
            fi
