name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # 1. SETUP PHP AND COMPOSER FIRST
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, json, libxml
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      # 2. SETUP NODE AND BUILD ASSETS SECOND
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      # `build:ssr` produces the client bundle *and* bootstrap/ssr/ssr.js, which
      # is the file Passenger boots. A plain `npm run build` would ship the app
      # without an SSR bundle, and Inertia would silently fall back to
      # client-side rendering.
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build:ssr

      - name: Verify SSR Bundle Was Built
        run: test -f bootstrap/ssr/ssr.js || (echo "SSR bundle missing — Passenger has nothing to boot." && exit 1)

      # 3. DEPLOYMENT STEPS REMAIN THE SAME
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Enable Maintenance Mode
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            php artisan down --refresh=15 || true

      # NOTE: bootstrap/ssr is deliberately NOT excluded — it holds the SSR
      # bundle Passenger boots. It is gitignored, but rsync copies the CI
      # workspace rather than the git index, so the freshly built bundle ships.
      - name: Deploy with Rsync
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DESTINATION_PATH }}
            
      - name: Run Post-Deployment Artisan Commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            if [ ! -L public/storage ]; then
              rm -rf public/storage
              php artisan storage:link
            fi

            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart || true

            # Passenger keeps the old SSR bundle resident in memory across a
            # deploy. Touching restart.txt makes it pick up the new one on the
            # next request; without this the site serves a stale render.
            mkdir -p tmp
            touch tmp/restart.txt

            php artisan up

      - name: Disable Maintenance Mode
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION_PATH }}
            php artisan up || true
